services:
  backend:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["thumbshield-data:/app/data"]
    environment:
      THUMBSHIELD_DATA_ROOT: /app/data
      BROWSER_ALLOWLIST: localhost:8100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  portal:
    build: .
    command: ["uv", "run", "uvicorn", "mock_portal.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["127.0.0.1:8100:8100"]
    volumes: ["thumbshield-data:/app/data"]
volumes:
  thumbshield-data:
